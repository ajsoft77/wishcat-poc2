<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101c2e" />
    <script>
      // 하위 경로(/parts)를 끝 슬래시 없이 열면 상대 경로 자산이 깨지므로 슬래시를 붙여 준다
      if (!/\/$|\.html$/.test(location.pathname)) location.replace(location.pathname + '/' + location.search + location.hash);
    </script>
    <title>파츠핏 — 내 차에 맞는 부품만</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
